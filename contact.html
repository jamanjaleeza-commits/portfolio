<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="css/contact.css"/>
  </head>

  <body>
<div class="topbar"> Jaleeza Jaman 
      <img src="img/pixelstar.png" alt="star" id="top-image" />
      <button class="contacts" >CONTACT ME</button>
      <button class="projects">MY PROJECTS</button>
      <button class="Home">HOME</button>
    </div>

    <section id="contact">
  <div class="contact-container">
    <h1>WANT TO SEND A MESSAGE?</h1>
    <form action='/contact' method='post'>
      <label for="name">NAME</label>
      <input type="text" id="name" name="name" required>

      <label for="email">EMAIL</label>
      <input type="email" id="email" name="email" required>

      <label for="message">MESSAGE</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">SEND</button>
    </form>
</div>
</section>

<div class="contact-info-wrapper">
          <div class="contact-info-box">
            <h3 class="info-title">CONTACT INFORMATION</h3>
            
            <div class="info-item">
              <h4 class="info-label">EMAIL</h4>
              <p class="info-text">jamanjaleeza@gmail.com</p>
            </div>

            <div class="info-item">
              <h4 class="info-label">PHONE</h4>
              <p class="info-text"><a href="tel:+5978714226">+597 871 4226</a></p>
            </div>

            <div class="info-item">
              <h4 class="info-label">LOCATION</h4>
              <p class="info-text">Paramaribo, Suriname</p>
            </div>

            <div class="info-item">
              <h4 class="info-label">FOLLOW ME</h4>
              <div class="social-links">
                <a href="#" class="social-link" title="LinkedIn">LINKEDIN</a>
                <a href="https://github.com/jamanjaleeza-commits" class="social-link" title="GitHub">GITHUB</a>
                <a href="https://www.facebook.com/share/1CxqcfwWS4/" class="social-link" title="Facebook">FACEBOOK</a>
              </div>
            </div>
          </div>
        </div>

    <script src="js/main.js"></script>
    
  </body>
  </html>
